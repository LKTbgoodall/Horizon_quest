# Horizon Quests: one flat package for Horizon's mod API (ADR-018). The
# launcher compiles src/ against the pinned SDK; the game loads assets/ and
# data/. Keep `version` equal to hq_meta::VERSION (a test checks it).
id = "horizon_quests"
name = "Horizon Quests"
version = "0.21.0"
description = "An FTB Quests-style quest book: a graphical book, quests with tasks and rewards, synced with the server."
authors = ["LKTbgoodall"]
api = "0.2"
# Both halves: the server runs the quests, the client draws the book, and the
# Quest Book item is a registry declaration every player must have.
side = "both"
capabilities = ["registries"]

# The build it is written against. Until a Nightly is built from Horizon
# `main` with the mod API, this is `main` itself (type-checked through
# tools/link-sdk); `cargo horizon-mod update` moves it to the Nightly.
[native]
game = "26.3"
horizon = "c07bfa76e71e8db9e84a7e61832a8fb898718e81"
mixins = "5a64af938ec86b00d53d16a408aabc0038fb3e57"
