[package]
name = "mod-horizon-quests"
version = "0.21.2"
edition = "2024"
license = "MIT"
publish = false
description = "Horizon Quests: an FTB Quests-style quest book for Horizon, as a native mod."

[dependencies]
# The pinned SDK's API crate. `cargo horizon-mod` fetches it into .horizon/sdk/
# (never committed); tools/link-sdk points it at a Horizon checkout instead.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Registry crates of our own, pinned in Cargo.lock (`horizon-launcher
# native-lock .`). Only the pure modules use them, never across the SDK's
# boundary (hq_net sends bytes, the stores read and write text).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
