[package]
name = "horizon-mod-horizon-quests"
version = "0.7.0"
edition = "2024"
license = "MIT"
publish = false
description = "Horizon Quests: an FTB Quests-style quest book for Horizon, as a native mod."

# The mod's pure logic and its tests: the same files the bundle adds to the
# game as modules of `crate::game`, reached here through src/lib.rs.
[lib]
path = "src/lib.rs"

# All three are dependencies of horizon-client (in Horizon's Cargo.lock), so
# the game has them too (like smp).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"  # Horizon fdc87ae locks 1.1.6: tested against the same
