[mod]
id = "horizon_quests"
version = "0.8.4"
priority = 100

# The commit it was built and tested on (native-build, 2026-11-10).
# "hooks": 400 in compatibility.json (the data packs' quest folders; the
# config files need 397, native_item_stack 313), so the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# Pure modules (also built by `cargo test` through src/lib.rs).
[[module]]
id = "meta"
file = "crates/horizon-client/src/game.rs"
name = "hq_meta"
source = "hq_meta.rs"

[[module]]
id = "canvas"
file = "crates/horizon-client/src/game.rs"
name = "hq_canvas"
source = "hq_canvas.rs"

[[module]]
id = "model"
file = "crates/horizon-client/src/game.rs"
name = "hq_model"
source = "hq_model.rs"

[[module]]
id = "validate"
file = "crates/horizon-client/src/game.rs"
name = "hq_validate"
source = "hq_validate.rs"

[[module]]
id = "logic"
file = "crates/horizon-client/src/game.rs"
name = "hq_logic"
source = "hq_logic.rs"

[[module]]
id = "progress"
file = "crates/horizon-client/src/game.rs"
name = "hq_progress"
source = "hq_progress.rs"

[[module]]
id = "store"
file = "crates/horizon-client/src/game.rs"
name = "hq_store"
source = "hq_store.rs"

[[module]]
id = "teams"
file = "crates/horizon-client/src/game.rs"
name = "hq_teams"
source = "hq_teams.rs"

[[module]]
id = "net"
file = "crates/horizon-client/src/game.rs"
name = "hq_net"
source = "hq_net.rs"

[[module]]
id = "book"
file = "crates/horizon-client/src/game.rs"
name = "hq_book"
source = "hq_book.rs"

[[module]]
id = "commands"
file = "crates/horizon-client/src/game.rs"
name = "hq_commands"
source = "hq_commands.rs"

[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "hq_config"
source = "hq_config.rs"

[[module]]
id = "session"
file = "crates/horizon-client/src/game.rs"
name = "hq_session"
source = "hq_session.rs"

# Glue: the code that touches the game.
[[module]]
id = "client_glue"
file = "crates/horizon-client/src/game.rs"
name = "hq_client_glue"
source = "hq_client_glue.rs"

[[module]]
id = "server_glue"
file = "crates/horizon-client/src/game.rs"
name = "hq_server_glue"
source = "hq_server_glue.rs"

# ---- Client: Options > Mods row, HUD hint, open key, retry tick ----

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "&mut *items" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

