[mod]
id = "horizon_quests"
version = "0.0.3"
priority = 100

# The commit it was built and tested on (native-build, 2026-11-10).
# ("hooks": 313 in compatibility.json, for native_item_stack), so the launcher
# builds it on any Horizon that has them.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# Pure modules (also built by `cargo test` through src/lib.rs).
[[module]]
id = "meta"
file = "crates/horizon-client/src/game.rs"
name = "hq_meta"
source = "hq_meta.rs"

[[module]]
id = "protocol"
file = "crates/horizon-client/src/game.rs"
name = "hq_protocol"
source = "hq_protocol.rs"

[[module]]
id = "canvas"
file = "crates/horizon-client/src/game.rs"
name = "hq_canvas"
source = "hq_canvas.rs"

[[module]]
id = "model"
file = "crates/horizon-client/src/game.rs"
name = "hq_model"
source = "hq_model.rs"

[[module]]
id = "validate"
file = "crates/horizon-client/src/game.rs"
name = "hq_validate"
source = "hq_validate.rs"

[[module]]
id = "logic"
file = "crates/horizon-client/src/game.rs"
name = "hq_logic"
source = "hq_logic.rs"

[[module]]
id = "progress"
file = "crates/horizon-client/src/game.rs"
name = "hq_progress"
source = "hq_progress.rs"

[[module]]
id = "store"
file = "crates/horizon-client/src/game.rs"
name = "hq_store"
source = "hq_store.rs"

[[module]]
id = "net"
file = "crates/horizon-client/src/game.rs"
name = "hq_net"
source = "hq_net.rs"

[[module]]
id = "book"
file = "crates/horizon-client/src/game.rs"
name = "hq_book"
source = "hq_book.rs"

[[module]]
id = "commands"
file = "crates/horizon-client/src/game.rs"
name = "hq_commands"
source = "hq_commands.rs"

[[module]]
id = "session"
file = "crates/horizon-client/src/game.rs"
name = "hq_session"
source = "hq_session.rs"

# Glue: the code that touches the game.
[[module]]
id = "client_glue"
file = "crates/horizon-client/src/game.rs"
name = "hq_client_glue"
source = "hq_client_glue.rs"

[[module]]
id = "server_glue"
file = "crates/horizon-client/src/game.rs"
name = "hq_server_glue"
source = "hq_server_glue.rs"

# ---- Client: Options > Mods row, HUD hint, open key, retry tick ----

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ---- Client: the quest book screen (API 78, 80, 93, 111, 123, 313) ----

[[injection]]
id = "render"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "pressed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "pressed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "dragged"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_dragged_pre"
helper = "dragged.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "delta", ty = "[f32; 2]", value = "delta" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scrolled"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_scrolled_pre"
helper = "scrolled.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

