# The content half of Horizon Quests: the Quest Book's model and texture.
# tools/build-mod.ps1 / build-mod.sh pack it with the native code into one
# horizon_quests.hmod. The Quest Book item itself is declared in code
# (items.rs); this only gives it its look. Keep `version` equal to
# hq_meta::VERSION (a test checks it).
id = "horizon_quests"
name = "Horizon Quests"
version = "0.10.5"
description = "An FTB Quests-style quest book: a graphical book, quests with tasks and rewards, synced with the server."
authors = ["LKTbgoodall"]
api = "0.2"
side = "client"
capabilities = ["registries"]
